version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    image: polyglot-backend:latest
    build: ./backend-dotnet
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

  worker:
    image: polyglot-worker:latest
    build: ./worker-python
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

  frontend:
    image: polyglot-frontend:latest
    build: ./frontend-js
    ports:
      - "8080:80"
    depends_on:
      - backend
