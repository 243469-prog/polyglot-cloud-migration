version: '3.8'

networks:
  polyglot-net:
    driver: bridge

services:
  # Tier 1: .NET Web API Backend
  backend:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: dotnet-backend-api
    ports:
      - "5000:5000"
    networks:
      - polyglot-net
    restart: always

  # Tier 2: Python Background Worker
  worker:
    build:
      context: ./worker-python
      dockerfile: Dockerfile
    container_name: python-task-worker
    depends_on:
      - backend
    networks:
      - polyglot-net
    restart: always

  # Tier 3: JavaScript/Nginx Frontend
  frontend:
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
    container_name: js-nginx-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - polyglot-net
    restart: always